# =============================================================================
# .forgejo/workflows/deploy.yml
# =============================================================================
# Codeberg (Forgejo Actions), self-hosted runner on Apple Silicon (M1 Pro),
# building for a x86_64 VPS.
#
# WHY IT'S FAST:
#   1. No registry round-trip: image is docker-save'd, zstd-compressed and
#      piped straight over SSH into the VPS's docker daemon.
#   2. Only the services whose files actually changed are rebuilt/redeployed.
#   3. BuildKit cache persists on the runner's disk (no --no-cache, ever).
#   4. Cross-arch builds avoid QEMU emulation by doing all the heavy lifting
#      (compiling, bundling) in a NATIVE arm64 stage, then copying the
#      finished artifact into a linux/amd64 stage that only runs COPY —
#      see the Dockerfile note at the bottom of this file.
#
# WHY THINGS THAT WERE IN THE OLD WORKFLOW ARE GONE:
#   - workflow_run trigger: not supported by Forgejo Actions
#     (github.com/forgejo/forgejo issue #6494 / #7722, still open) — so
#     build + deploy live in a single push-triggered workflow instead of
#     two chained workflows.
#   - no-cache: true: was forcing a full rebuild on every single push.
#
# PREREQUISITES ON THE RUNNER (Mac M1 Pro):
#   brew install jq zstd
#   Docker Desktop (or colima/lima) running, buildx available
#   forgejo-runner registered with labels: self-hosted, macos, arm64
#     -> when registering: forgejo-runner register --labels self-hosted,macos,arm64
#
# PREREQUISITES ON THE VPS (x86_64):
#   apt install zstd
#   an existing .env in the repo dir (same as before)
#
# REQUIRED CODEBERG SECRETS (repo/org settings -> Actions -> Secrets):
#   VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_PORT (optional), VITE_DEPAY_INTEGRATION_ID
# =============================================================================

name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Figure out which of the 4 services actually need rebuilding.
  # ---------------------------------------------------------------------------
  detect-changes:
    runs-on: [self-hosted, macos, arm64]
    outputs:
      matrix: ${{ steps.filter.outputs.matrix }}
      has_changes: ${{ steps.filter.outputs.has_changes }}
    steps:
      - uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine changed services
        id: filter
        run: |
          set -e
          BEFORE="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "Full build (manual dispatch or no previous commit to diff against)"
            CHANGED="backend web docs dev-dashboard"
          else
            DIFF=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
            CHANGED=""
            echo "$DIFF" | grep -qE '^apps/backend-go/'            && CHANGED="$CHANGED backend"
            echo "$DIFF" | grep -qE '^apps/web/|^package(-lock)?\.json$|^pnpm-lock\.yaml$' && CHANGED="$CHANGED web"
            echo "$DIFF" | grep -qE '^apps/docs/'                  && CHANGED="$CHANGED docs"
            echo "$DIFF" | grep -qE '^apps/dev-dashboard/'         && CHANGED="$CHANGED dev-dashboard"
          fi

          CHANGED=$(echo "$CHANGED" | xargs -n1 | sort -u | xargs)
          echo "Changed services: ${CHANGED:-none}"

          if [ -z "$CHANGED" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "matrix={\"service\":[]}" >> "$GITHUB_OUTPUT"
          else
            JSON=$(echo "$CHANGED" | xargs -n1 | jq -R . | jq -sc '{service: .}')
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "matrix=$JSON" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # Build (native arm64 where possible) and ship straight to the VPS.
  # ---------------------------------------------------------------------------
  build-and-ship:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.has_changes == 'true' }}
    runs-on: [self-hosted, macos, arm64]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - uses: https://github.com/actions/checkout@v4

      - name: Resolve build context for this service
        id: cfg
        run: |
          case "${{ matrix.service }}" in
            backend)       echo "context=apps/backend-go" >> "$GITHUB_OUTPUT"; echo "dockerfile=apps/backend-go/Dockerfile" >> "$GITHUB_OUTPUT" ;;
            web)           echo "context=."               >> "$GITHUB_OUTPUT"; echo "dockerfile=apps/web/Dockerfile"       >> "$GITHUB_OUTPUT" ;;
            docs)          echo "context=."               >> "$GITHUB_OUTPUT"; echo "dockerfile=apps/docs/Dockerfile"      >> "$GITHUB_OUTPUT" ;;
            dev-dashboard) echo "context=."               >> "$GITHUB_OUTPUT"; echo "dockerfile=apps/dev-dashboard/Dockerfile" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Set up persistent Buildx builder
        uses: https://github.com/docker/setup-buildx-action@v3
        with:
          install: true
          driver-opts: image=moby/buildkit:latest

      - name: Build linux/amd64 image (cache persists on this runner's disk)
        uses: https://github.com/docker/build-push-action@v6
        with:
          context: ${{ steps.cfg.outputs.context }}
          file: ${{ steps.cfg.outputs.dockerfile }}
          platforms: linux/amd64
          load: true
          tags: gomo6-${{ matrix.service }}:deploy
          build-args: |
            ${{ (matrix.service == 'web') && format('VITE_GIT_COMMIT={0}', github.sha) || '' }}
            ${{ (matrix.service == 'web') && format('VITE_DEPAY_INTEGRATION_ID={0}', secrets.VITE_DEPAY_INTEGRATION_ID) || '' }}
          cache-from: type=local,src=/tmp/buildx-cache/${{ matrix.service }}
          cache-to: type=local,dest=/tmp/buildx-cache/${{ matrix.service }},mode=max

      - name: Stream image directly into the VPS's Docker (no registry)
        run: |
          set -e
          echo "${{ secrets.VPS_SSH_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          docker save "gomo6-${{ matrix.service }}:deploy" \
            | zstd -T0 -1 \
            | ssh -o StrictHostKeyChecking=accept-new \
                  -i /tmp/deploy_key \
                  -p "${{ secrets.VPS_PORT || 22 }}" \
                  "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
                  'zstd -d | docker load'
          rm -f /tmp/deploy_key

  # ---------------------------------------------------------------------------
  # Restart only the containers that actually got a new image.
  # ---------------------------------------------------------------------------
  restart:
    needs: [detect-changes, build-and-ship]
    if: ${{ needs.detect-changes.outputs.has_changes == 'true' }}
    runs-on: [self-hosted, macos, arm64]
    steps:
      - name: Recreate changed services and reload Caddy if routing could be affected
        uses: https://github.com/appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 2m
          envs: CHANGED_SERVICES
          script: |
            set -e
            for d in /root/gomo6.2 /home/*/gomo6.2; do
              [ -d "$d" ] && [ -f "$d/docker-compose.yml" ] && { cd "$d"; break; }
            done
            [ "${PWD##*/}" = "gomo6.2" ] || { echo "Cannot find gomo6.2 repo"; exit 1; }

            docker compose config >/dev/null

            SERVICES="${CHANGED_SERVICES}"
            echo "Recreating: $SERVICES"
            docker compose up -d --no-build --remove-orphans $SERVICES

            # Caddyfile is bind-mounted; Compose won't detect content changes,
            # and its file-watcher reload can silently fail — restart it
            # explicitly whenever routing-relevant services changed.
            case "$SERVICES" in
              *web*|*docs*|*dev-dashboard*) docker compose restart caddy ;;
            esac

            docker image prune -f
            echo "=== Deploy done ==="
        env:
          CHANGED_SERVICES: ${{ join(fromJson(needs.detect-changes.outputs.matrix).service, ' ') }}
