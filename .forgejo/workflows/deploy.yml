# =============================================================================
# .forgejo/workflows/deploy.yml
# =============================================================================
# Gomo6 — Forgejo Actions deployment (Codeberg).
#
# Runner: your own Mac M1 Pro (self-hosted, host-mode, labels: self-hosted /
#         macos / arm64 / macos-arm64 — all `:host`).
# VPS:    1 vCPU / 1 GB — it NEVER builds anything, it only loads images and
#         starts containers.
#
# Pipeline:
#   1. build-and-ship — detects which services changed via the Codeberg
#                       COMPARE API (no git clone needed!), then builds ONLY
#                       those services in parallel (matrix). Everything heavy
#                       (Go compile, npm ci, Vite) runs NATIVE on arm64 — the
#                       Dockerfiles use `FROM --platform=$BUILDPLATFORM`
#                       builder stages, so QEMU never touches the compiler.
#                       The finished linux/amd64 image is piped straight into
#                       the VPS docker daemon over SSH (zstd-compressed
#                       `docker save`): no registry, no credentials, one hop.
#   2. restart        — skips itself when nothing changed, otherwise
#                       `docker compose up -d --no-build` recreates exactly
#                       the containers whose image changed.
#
# Why this is fast:
#   - "Nothing changed" pushes finish in seconds: change detection is a single
#     API call, checkout/build/stream are all skipped.
#   - Even changed services use a SHALLOW checkout (fetch-depth: 1) — the full
#     history is never downloaded. (The repo is ~300MB because of committed
#     backend binaries; remove them from history to shrink clones further.)
#   - BuildKit/Go/npm caches persist on the Mac between runs.
#
# Secrets (Codeberg repo/org → Settings → Actions → Secrets):
#   VPS_HOST, VPS_USER, VPS_SSH_KEY,
#   VPS_PORT (optional, default 22),
#   VITE_DEPAY_INTEGRATION_ID (only used by the web build)
#
# One-time setup:
#   Runner: native forgejo-runner v13 binary + `.forgejo-runner.yaml` with
#           `server.connections.codeberg` (uuid+token from the Codeberg UI)
#   VPS:    apt install zstd        (decompresses the streamed images)
#
# The VPS must have the repo checked out at /root/gomo6.2 or /home/*/gomo6.2
# with a production .env (see AGENTS.md). Images are tagged with the exact
# names from docker-compose.yml, so the VPS never pulls and never builds.
#
# If your VPS is arm64 instead of amd64, change --platform below once.
# =============================================================================

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Build & ship — one matrix job per service, all running in parallel.
  # Change detection uses the Codeberg compare API, so no checkout is needed
  # to find out whether a service changed. Checkout happens only afterwards,
  # and only for services that will actually build.
  # ---------------------------------------------------------------------------
  build-and-ship:
    name: Build & ship ${{ matrix.service }}
    runs-on: [self-hosted, macos, arm64]
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./apps/backend-go
            dockerfile: apps/backend-go/Dockerfile
            file_pattern: '^apps/backend-go/'
          - service: web
            context: .
            dockerfile: apps/web/Dockerfile
            file_pattern: '^apps/web/'
          - service: docs
            context: .
            dockerfile: apps/docs/Dockerfile
            file_pattern: '^apps/docs/'
          - service: dev-dashboard
            context: .
            dockerfile: apps/dev-dashboard/Dockerfile
            file_pattern: '^apps/dev-dashboard/'

    steps:
      - name: Detect changes (Codeberg API — no clone)
        id: detect
        run: |
          set -euo pipefail
          NEED=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            NEED=true
          else
            BEFORE="${{ github.event.before }}"
            SHA="${{ github.sha }}"
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "$SHA" ]; then
              DIFF="$(curl -fsS --max-time 20 \
                -H "Authorization: token ${{ github.token }}" \
                "https://codeberg.org/api/v1/repos/${{ github.repository }}/compare/${BEFORE}...${SHA}" 2>/dev/null \
                | python3 -c 'import json,sys; print("\n".join(f.get("filename","") for f in json.load(sys.stdin).get("files",[])))' 2>/dev/null \
                || true)"
              if [ -z "$DIFF" ]; then
                # API unavailable or `before` is gone (force push) — build to be safe.
                NEED=true
              else
                # Own directory touched → rebuild.
                echo "$DIFF" | grep -qE "${{ matrix.file_pattern }}" && NEED=true
                # Shared root files / workspace manifests → rebuild all frontends.
                case "${{ matrix.service }}" in
                  web|docs|dev-dashboard)
                    echo "$DIFF" | grep -qE '^(package\.json|package-lock\.json|turbo\.json)$|^apps/.*/package\.json$' && NEED=true ;;
                esac
                # Compose / Caddyfile / dockerignore at repo root → everything.
                echo "$DIFF" | grep -qE '^(docker-compose\.yml|Caddyfile|\.dockerignore)$' && NEED=true
              fi
            else
              NEED=true
            fi
          fi
          echo "changed=$NEED" >> "$GITHUB_OUTPUT"
          echo "changed=$NEED"

      - name: Checkout (shallow — the diff already came from the API)
        if: steps.detect.outputs.changed == 'true'
        # Forgejo-maintained mirror of actions/checkout — no GitHub involved.
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build linux/amd64 image (native arm64, disk-persisted cache)
        if: steps.detect.outputs.changed == 'true'
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/elcrazycol/gomo6-${{ matrix.service }}:latest"
          # No arrays here: expanding an empty array under `set -u` aborts on
          # macOS's default bash 3.2 ("unbound variable"). Build args as a
          # plain string instead (values never contain spaces).
          BUILD_ARGS=""
          if [ "${{ matrix.service }}" = "web" ]; then
            BUILD_ARGS="--build-arg VITE_GIT_COMMIT=${{ github.sha }} --build-arg VITE_DEPAY_INTEGRATION_ID=${{ secrets.VITE_DEPAY_INTEGRATION_ID }}"
          fi
          docker buildx build \
            --platform linux/amd64 \
            --load \
            -t "$IMAGE" \
            --cache-from "type=local,src=$HOME/buildx-cache/${{ matrix.service }}" \
            --cache-to "type=local,dest=$HOME/buildx-cache/${{ matrix.service }},mode=max" \
            $BUILD_ARGS \
            -f "${{ matrix.dockerfile }}" \
            "${{ matrix.context }}"

      - name: Stream image into VPS docker (no registry)
        if: steps.detect.outputs.changed == 'true'
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/elcrazycol/gomo6-${{ matrix.service }}:latest"
          KEY="$HOME/.ssh/vps_deploy_key"
          mkdir -p "$HOME/.ssh"
          # printf guarantees the trailing newline an SSH private key needs
          # (Forgejo may strip the last newline of a multiline secret).
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > "$KEY"
          chmod 600 "$KEY"
          docker save "$IMAGE" \
            | zstd -T0 -1 \
            | ssh -i "$KEY" -p "${{ secrets.VPS_PORT || 22 }}" \
                -o StrictHostKeyChecking=accept-new \
                -o ConnectTimeout=15 \
                "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
                'zstd -d | docker load'
          rm -f "$KEY"

  # ---------------------------------------------------------------------------
  # Restart — recreates exactly the containers that got a new image.
  # Skips itself (no SSH at all) when nothing relevant changed.
  # ---------------------------------------------------------------------------
  restart:
    name: Restart on VPS
    needs: build-and-ship
    runs-on: [self-hosted, macos, arm64]
    steps:
      - name: Skip if nothing changed
        id: check
        run: |
          set -euo pipefail
          # Fail-safe: restart UNLESS we are certain nothing changed. If the
          # API call fails we must not skip — build jobs may have already
          # streamed new images to the VPS.
          CHANGED=true
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            BEFORE="${{ github.event.before }}"
            SHA="${{ github.sha }}"
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "$SHA" ]; then
              N="$(curl -fsS --max-time 20 \
                -H "Authorization: token ${{ github.token }}" \
                "https://codeberg.org/api/v1/repos/${{ github.repository }}/compare/${BEFORE}...${SHA}" 2>/dev/null \
                | python3 -c 'import json,sys; print(len(json.load(sys.stdin).get("files",[])))' 2>/dev/null \
                || echo fail)"
              [ "$N" = "0" ] && CHANGED=false
            fi
          fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Fetch deploy script from repo (no checkout)
        if: steps.check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          curl -fsS --max-time 15 \
            -H "Authorization: token ${{ github.token }}" \
            "https://codeberg.org/${{ github.repository }}/raw/branch/main/scripts/remote-deploy.sh" \
            -o /tmp/gomo6-remote-deploy.sh

      - name: docker compose up --no-build
        if: steps.check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          KEY="$HOME/.ssh/vps_deploy_key"
          mkdir -p "$HOME/.ssh"
          # printf guarantees the trailing newline an SSH private key needs
          # (Forgejo may strip the last newline of a multiline secret).
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > "$KEY"
          chmod 600 "$KEY"
          scp -i "$KEY" -P "${{ secrets.VPS_PORT || 22 }}" \
              -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
              /tmp/gomo6-remote-deploy.sh \
              "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/gomo6-remote-deploy.sh"
          ssh -i "$KEY" -p "${{ secrets.VPS_PORT || 22 }}" \
              -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
              "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
              'bash /tmp/gomo6-remote-deploy.sh'
          rm -f "$KEY"
