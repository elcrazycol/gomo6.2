# =============================================================================
# .forgejo/workflows/deploy.yml
# =============================================================================
# Gomo6 — Forgejo Actions deployment (Codeberg).
#
# Runner: your own Mac M1 Pro (self-hosted, host-mode, labels: self-hosted /
#         macos / arm64 / macos-arm64 — all `:host`).
# VPS:    1 vCPU / 1 GB — it NEVER builds anything; it only pulls images and
#         starts containers.
#
# Pipeline (v3 — registry-based):
#   1. build-and-ship — detects which services changed via the Codeberg
#      COMPARE API (no full git clone needed!), then for each changed service:
#        a. Checkout via INCREMENTAL fetch into a persistent repo cache on the
#           runner ($HOME/gomo6-src). Only the changed blobs travel over the
#           wire — a normal commit checks out in ~5s instead of ~47s.
#        b. docker buildx build --push to the Codeberg container registry.
#           Layer dedup: only CHANGED layers upload (web ~3-5MB, backend
#           ~12-14MB) instead of the whole ~23MB image on every push.
#        c. Per-service restart on the VPS: docker pull the new layers (fast —
#           the VPS has a datacenter link), retag to the docker-compose image
#           name, `docker compose up -d --no-build <service>`. Caddy is
#           restarted by the web job whenever the Caddyfile changed.
#   2. No second job — each service restarts as soon as its image lands.
#
# Why the old `docker save | zstd | ssh docker load` stream was slow:
#   - The images are tiny (~21-23MB) and zstd compresses them ~0% (their
#     layers are already gzip-compressed inside), so every push sent the FULL
#     image over the runner's home uplink (~1.4 Mbps per parallel stream) —
#     hence 2m11s-2m29s per image.
#   - With a registry, unchanged layers are skipped entirely and the VPS pulls
#     from Codeberg over its fast datacenter link.
#
# Expected timing for a web-only commit: 2s detect + ~5s checkout + ~35s
# build+push + ~8s VPS pull+restart ≈ 60s. Backend commits add ~10-15s
# (bigger changed layer — the ~12-14MB binary over the uplink).
#
# Secrets (Codeberg repo/org → Settings → Actions → Secrets):
#   VPS_HOST, VPS_USER, VPS_SSH_KEY,
#   VPS_PORT (optional, default 22),
#   CODEREG_TOKEN — Codeberg personal access token (account `crazycol`) with
#                   `read:package` and `write:package` scopes. Used by the
#                   runner to push images to codeberg.org/crazycol/*.
#   VITE_DEPAY_INTEGRATION_ID (only used by the web build)
#   VITE_TURNSTILE_SITEKEY — Cloudflare Turnstile public sitekey (only used by
#                            the web build; it is a PUBLIC key, safe in CI)
#   VITE_SENTRY_DSN — Sentry public DSN (only used by the web build; it is a
#                     PUBLIC key, safe in CI — Sentry events go to it)
#
# One-time setup:
#   - Runner: native forgejo-runner binary + `.forgejo-runner.yaml` with
#             `server.connections.codeberg` (uuid+token from the Codeberg UI).
#   - Codeberg packages must be PUBLIC (default for a public repo) so the VPS
#     can `docker pull codeberg.org/crazycol/gomo6-*:latest` without auth.
#     If a pull is denied: codeberg.org/crazycol/-/packages → set public.
#   - The FIRST run after this change clones the repo once (~40s) and pushes
#     the full images once (~23MB each); afterwards both are incremental.
#   - zstd is no longer needed on the VPS (no more image streaming).
#
# The VPS must have the repo checked out at /root/gomo6.2 or /home/*/gomo6.2
# with a production .env (see AGENTS.md). The compose `image:` names stay
# ghcr.io/elcrazycol/* — the workflow retags the pulled image to that name,
# so the VPS never builds and never needs registry credentials.
#
# If your VPS is arm64 instead of amd64, change --platform below once.
# =============================================================================

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Build & ship — one matrix job per service, all running in parallel.
  # Change detection uses the Codeberg compare API, so no checkout is needed
  # to find out whether a service changed.
  # ---------------------------------------------------------------------------
  build-and-ship:
    name: Build & ship ${{ matrix.service }}
    runs-on: [self-hosted, macos, arm64]
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: apps/backend-go
            dockerfile: apps/backend-go/Dockerfile
            file_pattern: '^apps/backend-go/'
          - service: web
            context: .
            dockerfile: apps/web/Dockerfile
            file_pattern: '^apps/web/'
          - service: docs
            context: .
            dockerfile: apps/docs/Dockerfile
            file_pattern: '^apps/docs/'
          - service: dev-dashboard
            context: .
            dockerfile: apps/dev-dashboard/Dockerfile
            file_pattern: '^apps/dev-dashboard/'

    steps:
      - name: Detect changes (Codeberg API — no clone)
        id: detect
        run: |
          set -euo pipefail
          NEED=false
          CADDY=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            NEED=true
            CADDY=true
          else
            BEFORE="${{ github.event.before }}"
            SHA="${{ github.sha }}"
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "$SHA" ]; then
              DIFF="$(curl -fsS --max-time 20 \
                -H "Authorization: token ${{ github.token }}" \
                "https://codeberg.org/api/v1/repos/${{ github.repository }}/compare/${BEFORE}...${SHA}" 2>/dev/null \
                | python3 -c 'import json,sys; print("\n".join(f.get("filename","") for f in json.load(sys.stdin).get("files",[])))' 2>/dev/null \
                || true)"
              if [ -z "$DIFF" ]; then
                # API unavailable or `before` is gone (force push) — build to be safe.
                NEED=true
              else
                # Own directory touched → rebuild.
                echo "$DIFF" | grep -qE "${{ matrix.file_pattern }}" && NEED=true
                # Shared root files / workspace manifests → rebuild all frontends.
                case "${{ matrix.service }}" in
                  web|docs|dev-dashboard)
                    echo "$DIFF" | grep -qE '^(package\.json|package-lock\.json|turbo\.json)$|^apps/.*/package\.json$' && NEED=true ;;
                esac
                # Compose / Caddyfile / dockerignore at repo root + the deploy
                # pipeline files themselves → everything (pipeline changes must
                # re-ship every service).
                echo "$DIFF" | grep -qE '^(docker-compose\.yml|Caddyfile|\.dockerignore|\.forgejo/workflows/deploy\.yml|scripts/restart-service\.sh)$' && NEED=true
                echo "$DIFF" | grep -qE '^Caddyfile$' && CADDY=true
              fi
            else
              NEED=true
            fi
          fi
          echo "changed=$NEED" >> "$GITHUB_OUTPUT"
          echo "caddy_changed=$CADDY" >> "$GITHUB_OUTPUT"
          echo "changed=$NEED caddy_changed=$CADDY"

      - name: Checkout & registry login (incremental fetch, serialized)
        if: steps.detect.outputs.changed == 'true'
        run: |
          set -euo pipefail
          SRC="$HOME/gomo6-src"
          LOCK="$HOME/gomo6-src.lock"
          REPO="${{ github.repository }}"
          OWNER="${REPO%/*}"
          AUTH_URL="https://oauth2:${{ github.token }}@codeberg.org/$REPO.git"
          # The 4 matrix jobs share one cached repo — serialize fetch/reset.
          # macOS bash has no flock, so use a mkdir lock with a retry loop.
          # A stale lock from a crashed job (SIGKILL/reboot never fires the
          # EXIT trap) is swept automatically when older than 10 minutes.
          find "$LOCK" -mmin +10 -delete 2>/dev/null || true
          for i in $(seq 1 150); do
            mkdir "$LOCK" 2>/dev/null && break
            [ "$i" -eq 150 ] && { echo "Timed out waiting for checkout lock"; exit 1; }
            sleep 1
          done
          trap 'rmdir "$LOCK" 2>/dev/null || true' EXIT
          if [ -d "$SRC/.git" ]; then
            REV=FETCH_HEAD   # `git fetch` always writes .git/FETCH_HEAD
            if ! git -C "$SRC" fetch --depth 1 "$AUTH_URL" main; then
              # Transient network errors (SSL resets on flaky links) are common —
              # retry once before falling back to a fresh clone.
              echo "Fetch failed — one retry for transient network errors"
              sleep 2
              if ! git -C "$SRC" fetch --depth 1 "$AUTH_URL" main; then
                echo "Fetch failed again (force push?) — re-cloning the cache"
                rm -rf "$SRC"
              fi
            fi
          fi
          if [ ! -d "$SRC/.git" ]; then
            git clone --depth 1 "$AUTH_URL" "$SRC"
            # Never store the ephemeral runner token in the cached remote URL.
            git -C "$SRC" remote set-url origin "https://codeberg.org/$REPO.git"
            # git >= 2.47 no longer writes FETCH_HEAD on clone — HEAD is the tip.
            REV=HEAD
          fi
          git -C "$SRC" reset --hard "$REV"
          git -C "$SRC" clean -fdxq
          # Registry auth — fully keychain-free, buildx-safe:
          #  - A custom DOCKER_CONFIG shadows ~/.docker/cli-plugins, so docker
          #    can no longer find the buildx plugin ("unknown flag: --platform"
          #    — the whole bug series). Restore discovery via cliPluginsExtraDirs.
          #  - Write the auth directly instead of `docker login`: Docker
          #    Desktop's CLI injects credsStore: osxkeychain and stores creds
          #    in the macOS keychain, where a stale codeberg entry silently
          #    wins over new logins (-25299 / 401 reqPackageAccess). A plain
          #    auths entry in config.json never touches the keychain.
          rm -rf "$HOME/.docker-gomo6"
          mkdir -p "$HOME/.docker-gomo6"
          export DOCKER_CONFIG="$HOME/.docker-gomo6"
          AUTH="$(printf '%s:%s' "$OWNER" "${{ secrets.CODEREG_TOKEN }}" | base64)"
          printf '{"auths":{"codeberg.org":{"auth":"%s"}},"cliPluginsExtraDirs":["%s"]}' \
            "$AUTH" "$HOME/.docker/cli-plugins" > "$DOCKER_CONFIG/config.json"

      - name: Build & push image (native arm64 build → codeberg registry)
        if: steps.detect.outputs.changed == 'true'
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          OWNER="${REPO%/*}"          # derive — no github.repository_owner dependency
          REG="codeberg.org/$OWNER"
          IMAGE="$REG/gomo6-${{ matrix.service }}:latest"
          SRC="$HOME/gomo6-src"
          if [ "${{ matrix.context }}" = "." ]; then CTX="$SRC"; else CTX="$SRC/${{ matrix.context }}"; fi
          # docker login already ran (serialized) in the checkout step; read the
          # registry credentials from the same dedicated config dir (never the
          # macOS keychain, which may hold stale credentials).
          export DOCKER_CONFIG="$HOME/.docker-gomo6"
          # No arrays here: expanding an empty array under `set -u` aborts on
          # macOS's default bash 3.2 ("unbound variable"). Build args as a
          # plain string instead (values never contain spaces).
          BUILD_ARGS=""
          # Product version from the root VERSION file — bumped per release
          # (see CONTRIBUTING.md "Release ritual").
          APP_VERSION="$(cat "$SRC/VERSION")"
          if [ "${{ matrix.service }}" = "web" ]; then
            BUILD_ARGS="--build-arg VITE_GIT_COMMIT=${{ github.sha }} --build-arg VITE_APP_VERSION=$APP_VERSION --build-arg VITE_DEPAY_INTEGRATION_ID=${{ secrets.VITE_DEPAY_INTEGRATION_ID }} --build-arg VITE_TURNSTILE_SITEKEY=${{ secrets.VITE_TURNSTILE_SITEKEY }} --build-arg VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}"
          elif [ "${{ matrix.service }}" = "backend" ]; then
            BUILD_ARGS="--build-arg VERSION=$APP_VERSION --build-arg GIT_COMMIT=${{ github.sha }}"
          fi
          # Tag the image three ways: :latest (what compose uses), :v<version>
          # (current release) and :sha-<commit> (exact deploy snapshot, used
          # for rollbacks: restart-service.sh with TAG=sha-<commit>).
          docker buildx build \
            --platform linux/amd64 \
            --push \
            --provenance=false \
            -t "$IMAGE" \
            -t "$REG/gomo6-${{ matrix.service }}:v$APP_VERSION" \
            -t "$REG/gomo6-${{ matrix.service }}:sha-${{ github.sha }}" \
            --cache-from "type=local,src=$HOME/buildx-cache/${{ matrix.service }}" \
            --cache-to "type=local,dest=$HOME/buildx-cache/${{ matrix.service }},mode=max" \
            $BUILD_ARGS \
            -f "$SRC/${{ matrix.dockerfile }}" \
            "$CTX"

      - name: Prune old sha-* package versions (keep newest 6)
        # The Codeberg registry has a finite storage quota (pushes die with
        # "413 enforcePackagesQuota" when full) and every deploy adds a
        # sha-<commit> version that never goes away. Best-effort cleanup keeps
        # the newest 6 sha-* versions so deploys never get blocked; rollback
        # still works within that window. Never fails the job.
        if: steps.detect.outputs.changed == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          export REPO="${{ github.repository }}"
          export OWNER="${REPO%/*}"
          export NAME="gomo6-${{ matrix.service }}"
          export TOKEN="${{ secrets.CODEREG_TOKEN }}"
          export KEEP=6
          curl -fsS --max-time 30 \
            -H "Authorization: token $TOKEN" \
            "https://codeberg.org/api/v1/packages/$OWNER/container/$NAME" \
          | python3 - <<'PY'
          import json, os, sys, urllib.error, urllib.parse, urllib.request

          owner = os.environ["OWNER"]
          name = os.environ["NAME"]
          keep = int(os.environ["KEEP"])
          token = os.environ["TOKEN"]
          base = "https://codeberg.org/api/v1/packages"

          try:
              versions = json.load(sys.stdin)
          except Exception as e:
              print(f"prune: cannot parse versions list: {e}")
              sys.exit(0)

          if not isinstance(versions, list):
              print(f"prune: unexpected response shape: {type(versions)}")
              sys.exit(0)

          sha = [v for v in versions if str(v.get("version", "")).startswith("sha-")]
          sha.sort(key=lambda v: v.get("created_at", ""), reverse=True)
          old = sha[keep:]
          print(f"prune: {len(sha)} sha-* versions, deleting {len(old)} (keep {keep})")
          for v in old:
              ver = urllib.parse.quote(v["version"], safe="")
              req = urllib.request.Request(f"{base}/{owner}/container/{name}/{ver}", method="DELETE")
              req.add_header("Authorization", f"token {token}")
              try:
                  urllib.request.urlopen(req, timeout=30)
                  print(f"prune: deleted {v['version']}")
              except urllib.error.HTTPError as e:
                  # 401 = token lacks package-write scope; 404 = already gone.
                  print(f"prune: skip {v['version']}: {e.code} {e.reason}")
          PY

      - name: Restart ${{ matrix.service }} on VPS (pull + compose up)
        if: steps.detect.outputs.changed == 'true'
        run: |
          set -euo pipefail
          # Per-job key path: the 4 matrix jobs run in parallel and each removes
          # its key at the end — a shared path lets one job delete the key while
          # another is mid-scp/ssh ("no such identity"). BatchMode fails fast
          # instead of hanging on a password prompt.
          KEY="$HOME/.ssh/vps_deploy_key_${{ matrix.service }}"
          mkdir -p "$HOME/.ssh"
          # printf guarantees the trailing newline an SSH private key needs
          # (Forgejo may strip the last newline of a multiline secret).
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > "$KEY"
          chmod 600 "$KEY"
          # Remove the key even if a later step fails (private key hygiene).
          trap 'rm -f "$KEY"' EXIT
          REPO="${{ github.repository }}"
          OWNER="${REPO%/*}"
          scp -i "$KEY" -P "${{ secrets.VPS_PORT || 22 }}" \
              -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
              "$HOME/gomo6-src/scripts/restart-service.sh" \
              "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/gomo6-restart-service.sh"
          # restart-service.sh git-syncs the VPS repo to the latest main from
          # the public Codeberg HTTPS origin (Caddyfile, docker-compose.yml,
          # scripts) before composing up — no per-file scp, no VPS credentials.
          ssh -i "$KEY" -p "${{ secrets.VPS_PORT || 22 }}" \
              -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
              "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
              "REG=codeberg.org/$OWNER COMPOSE_NAMESPACE=ghcr.io/elcrazycol CADDY_CHANGED=${{ steps.detect.outputs.caddy_changed }} bash /tmp/gomo6-restart-service.sh ${{ matrix.service }}"
          rm -f "$KEY"
