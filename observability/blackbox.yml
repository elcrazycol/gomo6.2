# blackbox-exporter probe modules.
#
# Used by vmagent's `blackbox` job: it scrapes /probe?target=<url>&module=http_2xx
# and turns the result into probe_* series (up/down, latency, TLS expiry) that
# vmalert alerts on.

modules:
  http_2xx:
    prober: http
    timeout: 10s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200]
      follow_redirects: true
      preferred_ip_protocol: ipv4
      tls_config:
        insecure_skip_verify: false

  # Plain TCP reachability — useful for internal services without an HTTP
  # health endpoint.
  tcp_connect:
    prober: tcp
    timeout: 5s
