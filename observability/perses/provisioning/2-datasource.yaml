# VictoriaMetrics speaks the Prometheus query API, so the stock
# PrometheusDatasource plugin works unchanged — Proxy points the Perses server
# at the in-network VM endpoint.
kind: GlobalDatasource
metadata:
  name: victoriametrics
spec:
  default: true
  plugin:
    kind: PrometheusDatasource
    spec:
      proxy:
        kind: HTTPProxy
        spec:
          url: http://victoriametrics:8428
