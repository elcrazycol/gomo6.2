    get:
      description: 'Stream an object from storage (supports Range requests). The private
        ''uploads'' bucket requires message membership. NOTE: the actual path is /storage/v1/object/{bucket}/{key},
        outside the /api/v1 base path shown here.'
      parameters:
      - description: Bucket
        in: path
        name: bucket
        required: true
        type: string
      - description: Object key
        in: path
