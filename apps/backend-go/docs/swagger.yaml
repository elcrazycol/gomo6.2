        outside the /api/v1 base path shown here.'
      parameters:
      - description: Token to introspect
        in: formData
        name: token
        required: true
        type: string
      - description: access_token | refresh_token
        in: formData
        name: token_type_hint
        type: string
      - description: Client ID (client authentication)
        in: formData
        name: client_id
