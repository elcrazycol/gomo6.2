  /oauth/authorize:
    get:
      description: 'OAuth 2.0 authorization endpoint (authorization code + PKCE S256).
        Requires an authenticated session and consent=true. NOTE: the actual path
        is /oauth/authorize, outside the /api/v1 base path shown here.'
      parameters:
      - description: Must be 'code'
        in: query
        name: response_type
        required: true
        type: string
      - description: OAuth application client ID
        in: query
        name: client_id
        required: true
        type: string
      - description: Registered redirect URI
        in: query
        name: redirect_uri
        required: true
        type: string
      - description: Requested scopes (e.g. openid profile email)
        in: query
        name: scope
        type: string
      - description: CSRF state, echoed back
        in: query
        name: state
        type: string
      - description: PKCE S256 challenge
        in: query
        name: code_challenge
        required: true
        type: string
      - description: Must be 'S256'
        in: query
        name: code_challenge_method
        required: true
        type: string
      - description: OpenID Connect nonce
        in: query
        name: nonce
        type: string
      - description: Must be 'true' when called from the consent page
        in: query
        name: consent
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "302":
          description: Found
        "400":
          description: Bad Request
          schema:
            type: object
      summary: OAuth authorize
      tags:
      - OAuth
