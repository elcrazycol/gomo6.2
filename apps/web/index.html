<!doctype html>
<html lang="ru">
  <head>
    <script>
      // Pre-boot theme: resolve and paint the saved theme before any stylesheet
      // or bundle loads, so there is no flash of the default theme (FOUC).
      // Keep the id list in sync with src/theme/registry.ts (guarded by a test).
      (function () {
        try {
          var THEMES = ["cannabis", "pink", "graphite", "lavender", "volcanic", "mint", "glass", "linen", "ash", "sand", "slate", "charcoal", "obsidian", "synthwave", "terminal", "paper", "contrast", "contrastLight"];
          var store = window.localStorage;
          var theme = store.getItem("color-theme");
          if (THEMES.indexOf(theme) === -1) theme = "ash";
          var pref = store.getItem("theme-mode");
          if (pref !== "light" && pref !== "dark" && pref !== "system") {
            var legacy = store.getItem("dark-mode");
            pref = legacy === null ? "system" : legacy === "true" ? "dark" : "light";
          }
          var mode =
            pref === "system"
              ? window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : pref;
          if (store.getItem("theme-time-auto") === "true") {
            var hour = new Date().getHours();
            mode = hour >= 7 && hour < 19 ? "light" : "dark";
          }
          // Single-mode themes ignore the switch (keep in sync with the registry).
          var SINGLE = { terminal: "dark", paper: "light", contrast: "dark", contrastLight: "light", linen: "light", charcoal: "dark" };
          if (SINGLE[theme]) mode = SINGLE[theme];
          var root = document.documentElement;
          root.classList.toggle("dark", mode === "dark");
          root.dataset.theme = theme;
          root.dataset.mode = mode;
          root.dataset.themePref = pref;
        } catch (e) {
          /* storage blocked — fall back to defaults */
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content (Chrome Android 108+, Firefox Android 132+):
     shrink the layout viewport when the software keyboard opens so flex/grid
     layouts keep fixed bars above the keyboard natively. iOS ignores it — the
     JS keyboard layer (lib/mobileKeyboard.ts) handles iOS via visualViewport. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
