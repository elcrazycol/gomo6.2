# =============================================================================
# SPA-friendly nginx config for the main web app
# =============================================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression is handled by Caddy (`encode zstd gzip`) so the whole site —
    # static files AND API JSON from the Go backend — gets one compression
    # layer at the edge with zstd where supported. Compressing here as well
    # would make Caddy skip already-encoded responses and lose zstd on static.

    # Security headers are set globally by Caddy reverse proxy.

    # SPA entry: always revalidate index.html so a freshly deployed build
    # (new hashed assets) is picked up immediately instead of serving a stale
    # HTML that references already-deleted chunks.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # PWA files are NOT hashed, so they must never be cached: if the browser's
    # HTTP cache served a stale sw.js, registration.update() would see the old
    # bytes and the deploy would never be detected. registerSW.js bootstraps
    # the registration, manifest.webmanifest drives the install prompt.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /sw.mjs {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA routing: serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long cache for hashed static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
